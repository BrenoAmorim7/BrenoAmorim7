<svg width="100%" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1035"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- camadas da "rede neural" -->
  <g id="layer1">
    <circle cx="120" cy="60" r="7" fill="url(#node)"/>
    <circle cx="120" cy="110" r="7" fill="url(#node)"/>
    <circle cx="120" cy="160" r="7" fill="url(#node)"/>
  </g>
  <g id="layer2">
    <circle cx="280" cy="40" r="7" fill="url(#node)"/>
    <circle cx="280" cy="90" r="7" fill="url(#node)"/>
    <circle cx="280" cy="140" r="7" fill="url(#node)"/>
    <circle cx="280" cy="180" r="7" fill="url(#node)"/>
  </g>
  <g id="layer3">
    <circle cx="440" cy="60" r="7" fill="url(#node)"/>
    <circle cx="440" cy="110" r="7" fill="url(#node)"/>
    <circle cx="440" cy="160" r="7" fill="url(#node)"/>
  </g>

  <!-- conexões -->
  <g stroke="url(#line)" stroke-width="1" opacity="0.55">
    <line x1="120" y1="60" x2="280" y2="40"/>
    <line x1="120" y1="60" x2="280" y2="90"/>
    <line x1="120" y1="60" x2="280" y2="140"/>
    <line x1="120" y1="110" x2="280" y2="40"/>
    <line x1="120" y1="110" x2="280" y2="90"/>
    <line x1="120" y1="110" x2="280" y2="180"/>
    <line x1="120" y1="160" x2="280" y2="90"/>
    <line x1="120" y1="160" x2="280" y2="140"/>
    <line x1="120" y1="160" x2="280" y2="180"/>

    <line x1="280" y1="40" x2="440" y2="60"/>
    <line x1="280" y1="90" x2="440" y2="60"/>
    <line x1="280" y1="90" x2="440" y2="110"/>
    <line x1="280" y1="140" x2="440" y2="110"/>
    <line x1="280" y1="140" x2="440" y2="160"/>
    <line x1="280" y1="180" x2="440" y2="160"/>
  </g>

  <!-- pulsos animados percorrendo a rede -->
  <circle r="4" fill="#c4b5fd">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M120,60 L280,90 L440,110"/>
  </circle>
  <circle r="4" fill="#7dd3fc">
    <animateMotion dur="3s" repeatCount="indefinite" path="M120,160 L280,140 L440,160"/>
  </circle>
  <circle r="4" fill="#c4b5fd">
    <animateMotion dur="2.7s" repeatCount="indefinite" path="M120,110 L280,40 L440,60"/>
  </circle>

  <!-- nós pulsando -->
  <g fill="none">
    <circle cx="280" cy="90" r="7" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="110" r="7" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="7;14;7" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- linhas de "código de dados" no fundo -->
  <text x="600" y="50" fill="#7c3aed" opacity="0.25" font-family="monospace" font-size="14">SELECT * FROM dados;</text>
  <text x="600" y="80" fill="#0284c7" opacity="0.25" font-family="monospace" font-size="14">import pandas as pd</text>
  <text x="600" y="110" fill="#7c3aed" opacity="0.25" font-family="monospace" font-size="14">model.fit(X_train, y_train)</text>
  <text x="600" y="140" fill="#0284c7" opacity="0.25" font-family="monospace" font-size="14">CREATE TABLE alunos (...)</text>
  <text x="600" y="170" fill="#7c3aed" opacity="0.25" font-family="monospace" font-size="14">df.groupby("categoria").mean()</text>

  <!-- título -->
  <text x="500" y="205" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="30" font-weight="bold">Breno Nunes</text>
</svg>
